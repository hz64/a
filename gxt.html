<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高新通APP - 立即下载</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 自定义配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF', // 企业主色调（可替换）
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .hover-scale {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .hover-scale:hover {
                transform: scale(1.03);
                box-shadow: 0 10px 25px -5px rgba(22, 93, 255, 0.2);
            }
            .bg-gradient-primary {
                background: linear-gradient(135deg, #165DFF 0%, #0A2463 100%);
            }
            .app-mockup {
                border-radius: 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }
        }
    </style>
</head>
<body class="font-sans bg-gray-50 text-gray-800 antialiased">
    <!-- 极简导航栏（替换为真实Logo） -->
    <header class="fixed w-full top-0 z-50 bg-white/90 backdrop-blur-sm shadow-sm">
        <div class="container mx-auto px-4 sm:px-6 py-3">
            <a href="#" class="flex items-center gap-2">
                <!-- 替换为你的真实APP Logo -->
                <img 
                    src="https://hz6.xx.kg/assets/img/logo.png" 
                    alt="高新通Logo" 
                    class="w-8 h-8 rounded-lg object-cover"
                >
                <!-- APP名称 -->
                <span class="text-lg font-bold text-gray-800">高新通</span>
            </a>
        </div>
    </header>

    <!-- 核心下载区（唯一核心模块） -->
    <section class="min-h-screen flex items-center justify-center pt-20 pb-16 px-4">
        <div class="container max-w-5xl mx-auto">
            <div class="flex flex-col lg:flex-row items-center gap-10 lg:gap-20">
                <!-- 左侧：APP信息 + 下载按钮 -->
                <div class="w-full lg:w-1/2 text-center lg:text-left">
                    <!-- APP主名称 -->
                    <h1 class="text-[clamp(2.5rem,6vw,4rem)] font-bold text-gray-900 mb-4 leading-tight">
                        高新通
                    </h1>
                    <!-- APP副标题/简介 -->
                    <p class="text-[clamp(1rem,2vw,1.25rem)] text-gray-600 mb-8 max-w-md mx-auto lg:mx-0">
                        高效·安全·快速
                    </p>
                    <!-- 核心下载按钮 -->
                    <a href="https://hz6.de5.net/gxt_1.0.0.apk" class="inline-block bg-primary text-white px-8 py-4 rounded-xl font-semibold text-lg hover-scale transition-all">
                        <i class="fa-solid fa-download mr-2"></i> 立即下载
                    </a>
                    <!-- 辅助说明 -->
                    <p class="text-sm text-gray-500 mt-4">
                        仅支持 Android
                    </p>
                </div>

                <!-- 右侧：APP展示图 -->
                <div class="w-full lg:w-1/2 flex justify-center lg:justify-end">
                    <div class="relative hover-scale">
                        <!-- APP手机样机展示图（可替换为你的APP截图） -->
                        <img 
                            src="https://hz6.de5.net/app.jpg" 
                            alt="高新通APP展示" 
                            class="app-mockup max-w-[280px] sm:max-w-[320px] w-full"
                        >
                        <!-- 装饰光晕 -->
                        <div class="absolute -inset-4 bg-primary/10 rounded-3xl blur-2xl -z-10"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 极简底部版权 -->
    <footer class="bg-white py-6 text-center text-sm text-gray-500">
        <p>© 2026 高新通APP 版权所有</p>
    </footer>

    <!-- 简单滚动交互 -->
    <script>
        // 导航栏滚动效果
        const navbar = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                navbar.classList.add('shadow-md');
                navbar.classList.remove('shadow-sm');
            } else {
                navbar.classList.remove('shadow-md');
                navbar.classList.add('shadow-sm');
            }
        });
    </script>
</body>
</html>
